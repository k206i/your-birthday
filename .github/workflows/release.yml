name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Resolve version from tag
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          NUM="${RAW%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NUM"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "versionName=$RAW versionCode=$CODE"
          echo "APP_VERSION_NAME=$RAW" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Секрет KEYSTORE_BASE64 не задан — подписать release нечем"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Сборка для GitHub: с проверкой обновлений, она уходит в релиз
      - name: Build web with update check
        env:
          UPDATE_CHECK: 'true'
        run: npm run build

      - name: Sync Capacitor for GitHub
        run: npx cap sync android

      - name: Build GitHub APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename GitHub APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "birthday-${GITHUB_REF_NAME}.apk"

      # Сборка для магазинов: без проверки обновлений, она уходит в артефакты прогона
      - name: Build web for stores
        run: npm run build

      - name: Sync Capacitor for stores
        run: npx cap sync android

      - name: Build store APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename store APK
        run: mv android/app/build/outputs/apk/release/app-release.apk "birthday-${GITHUB_REF_NAME}-store.apk"

      - name: Upload store APK
        uses: actions/upload-artifact@v4
        with:
          name: store-apk
          path: birthday-${{ github.ref_name }}-store.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "День рождения ${GITHUB_REF_NAME}" "birthday-${GITHUB_REF_NAME}.apk"
